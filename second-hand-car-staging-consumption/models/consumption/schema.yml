version: 2

models:
  - name: dim_customer

    description: >
      Customer dimension loaded incrementally from
      DQLABS.CMX_STAGING.STG_CUSTOMERS.

    meta:
      prizm_pipeline: DBT_SECOND_HAND_CAR_STAGING_TO_CONSUMPTION
      prizm_asset_group: CUSTOMER
      prizm_operation: INCREMENTAL_INSERT_NEW
      prizm_source: DQLABS.CMX_STAGING.STG_CUSTOMERS
      prizm_target: DQLABS.CMX_CONSUMPTION.DIM_CUSTOMER
      prizm_orchestrator: DBT_CLOUD

    columns:
      - name: CUSTOMER_ID
        description: "Unique customer business identifier."
        data_tests:
          - not_null
          - unique

  - name: dim_car

    description: >
      Car dimension loaded incrementally from
      DQLABS.CMX_STAGING.STG_CAR_INVENTORY.

    meta:
      prizm_pipeline: DBT_SECOND_HAND_CAR_STAGING_TO_CONSUMPTION
      prizm_asset_group: CAR_INVENTORY
      prizm_operation: INCREMENTAL_INSERT_NEW
      prizm_source: DQLABS.CMX_STAGING.STG_CAR_INVENTORY
      prizm_target: DQLABS.CMX_CONSUMPTION.DIM_CAR
      prizm_orchestrator: DBT_CLOUD

    columns:
      - name: CAR_ID
        description: "Unique car identifier."
        data_tests:
          - not_null
          - unique

  - name: fact_car_sales

    description: >
      Car-sales fact table loaded incrementally from
      DQLABS.CMX_STAGING.STG_SALES_TRANSACTION.

    meta:
      prizm_pipeline: DBT_SECOND_HAND_CAR_STAGING_TO_CONSUMPTION
      prizm_asset_group: CAR_SALES
      prizm_operation: INCREMENTAL_INSERT_NEW
      prizm_source: DQLABS.CMX_STAGING.STG_SALES_TRANSACTION
      prizm_target: DQLABS.CMX_CONSUMPTION.FACT_CAR_SALES
      prizm_orchestrator: DBT_CLOUD

    columns:
      - name: SALE_ID
        description: "Unique sales transaction identifier."
        data_tests:
          - not_null
          - unique