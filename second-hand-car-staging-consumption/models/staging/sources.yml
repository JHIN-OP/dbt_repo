version: 2

sources:
  - name: cmx_staging

    description: >
      Snowflake staging tables loaded from MSSQL
      by the second-hand-car ingestion pipeline.

    database: DQLABS
    schema: CMX_STAGING

    meta:
      prizm_pipeline: DBT_SECOND_HAND_CAR_STAGING_TO_CONSUMPTION
      prizm_platform: SNOWFLAKE
      prizm_database: DQLABS
      prizm_schema: CMX_STAGING
      prizm_layer: STAGING

    tables:
      - name: stg_customers
        identifier: STG_CUSTOMERS
        description: "Second-hand-car customer staging records."

      - name: stg_car_inventory
        identifier: STG_CAR_INVENTORY
        description: "Second-hand-car inventory staging records."

      - name: stg_sales_transaction
        identifier: STG_SALES_TRANSACTION
        description: "Second-hand-car sales staging records."