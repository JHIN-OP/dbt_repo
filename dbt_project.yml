name: "second_hand_car_snowflake"
version: "1.0.0"
config-version: 2

profile: "second_hand_car_snowflake"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  second_hand_car_snowflake:
    consumption:
      +database: DQLABS
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: fail
      +tags:
        - PRIZM
        - SECOND_HAND_CAR
        - SNOWFLAKE
        - STAGING_TO_CONSUMPTION