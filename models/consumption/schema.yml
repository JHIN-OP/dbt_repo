version: 2

models:
  - name: dim_customer
    description: >
      Customer dimension loaded incrementally from
      DQLABS.CMX_STAGING.STG_CUSTOMERS.

    config:
      meta:
        prizm_pipeline: DBT_SECOND_HAND_CAR_STAGING_TO_CONSUMPTION
        prizm_asset_group: CUSTOMER
        prizm_operation: INCREMENTAL_INSERT_NEW
        prizm_source: DQLABS.CMX_STAGING.STG_CUSTOMERS
        prizm_target: DQLABS.CMX_CONSUMPTION.DIM_CUSTOMER
        prizm_orchestrator: DBT_CLOUD
        prizm_platform: SNOWFLAKE

    columns:
      - name: CUSTOMER_ID
        description: "Unique customer business identifier."
        tests:
          - not_null
          - unique

  - name: dim_car
    description: >
      Second-hand car dimension used by Tableau dashboards and
      downstream sales reporting.

    columns:
      - name: CAR_ID
        description: Unique business identifier for each car.
        data_tests:
          - not_null:
              config:
                severity: error
                store_failures: true

          - unique:
              config:
                severity: error
                store_failures: true

      - name: CAR_YEAR
        description: Manufacturing year used by Tableau reporting.
        data_tests:
          - not_null:
              config:
                severity: error
                store_failures: true

  - name: fact_car_sales
    description: >
      Car-sales fact table loaded incrementally from
      DQLABS.CMX_STAGING.STG_SALES_TRANSACTIONS.

    config:
      meta:
        prizm_pipeline: DBT_SECOND_HAND_CAR_STAGING_TO_CONSUMPTION
        prizm_asset_group: CAR_SALES
        prizm_operation: INCREMENTAL_INSERT_NEW
        prizm_source: DQLABS.CMX_STAGING.STG_SALES_TRANSACTIONS
        prizm_target: DQLABS.CMX_CONSUMPTION.FACT_CAR_SALES
        prizm_orchestrator: DBT_CLOUD
        prizm_platform: SNOWFLAKE

    columns:
      - name: SALE_ID
        description: "Unique sales transaction identifier."
        tests:
          - not_null
          - unique